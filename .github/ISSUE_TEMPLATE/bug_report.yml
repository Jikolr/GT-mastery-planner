name: Bug report
description: Report a reproducible application problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the problem and the expected result.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Click...\n3. See..."
    validations:
      required: true
  - type: input
    attributes:
      label: Application version
      placeholder: "0.2.0"
  - type: input
    attributes:
      label: Windows version
  - type: textarea
    attributes:
      label: Screenshot or logs
